<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      h2,
      p {
        color: blue;
        font-style: italic;
      }
    </style>
    <title>Bài 9 thẻ br/hr</title>
  </head>
  <body>
    <p>
      <!-- thẻ br - break : phá vỡ hoặc ngắt dòng -->
      Thu đi để lại lá vàng <br />
      Anh đi để lại cho nàng thằng cu <br />
      Mùa thu nối tiếp mùa thu <br />
      Thằng cu nối tiếp thằng cu ra đời <br />
    </p>
    <!-- thẻ hr - tạo đường kẻ ngang ngăn cách trên trang  -->
    <h2>
      Lorem ipsum dolor sit amet.
      <hr />
      Optio incidunt quod commodi provident.
      <hr />
      Repellendus commodi non voluptas recusandae!
      <hr />
      Asperiores in eveniet cupiditate eius?
      <hr />
    </h2>
  </body>
</html>
