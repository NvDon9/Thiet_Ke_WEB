<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thẻ b, i, u</title>
  </head>
  <body>
    <!-- b- strong hiển thị in đậm giống nhau
         u - gạch chân
         i- em nhấn mạnh nội dung (in nghiêng ) 
         
        - em, strong là thẻ mang ngữ nghĩa giúp trình duyệt hiểu rằng đây là nội dung cần được nhấn mạnh
        - b,i không mang ngữ nghĩa
        - giúp trình phân tích website hiểu web của bạn có những nội dung nào chủ yếu

       
        -->
    <p>
      Lorem ipsum dolor <strong>sit amet consectetur adipisicing elit</strong>.
      Hic officia <em>corrupti provident</em> necessitatibus debitis eum
      architecto iure repellat, <u>corporis libero</u> ratione dolor est sunt
      quas autem cum.
      <u
        ><i><b>Nobis, sunt fugit.</b></i></u
      >
    </p>
  </body>
</html>
